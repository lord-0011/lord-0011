<svg xmlns="http://www.w3.org/2000/svg" width="820" height="262" viewBox="0 0 820 262" role="img" aria-labelledby="title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">whoami: Priyanshu Kumar, B.Tech CSE 2026, full-stack developer. Now: sending bug fixes to React and Next.js libraries. Merged so far: Mantine, React Flow, Zag, Fumadocs.</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #c9d1d9; white-space: pre; }
    .user { fill: #7ee787; }
    .path { fill: #79c0ff; }
    .dim { fill: #8b949e; }
    .accent { fill: #ffa657; }
    .cover { fill: #0d1117; animation: type var(--d) steps(var(--n), end) var(--t) both; }
    .out { opacity: 0; animation: show 0.01s linear var(--t) both; }
    .cursor { fill: #c9d1d9; opacity: 0; animation: show 0.01s linear 5.6s both, blink 1.1s steps(1) 5.6s infinite; }
    @keyframes type { to { transform: translateX(var(--w)); } }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cover { animation: none; transform: translateX(820px); }
      .out { animation: none; opacity: 1; }
      .cursor { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <clipPath id="screen"><rect x="1" y="39" width="818" height="222"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="819" height="261" rx="10" fill="#0d1117" stroke="#30363d"/>
  <circle cx="22" cy="20" r="5.5" fill="#ff5f57"/>
  <circle cx="40" cy="20" r="5.5" fill="#febc2e"/>
  <circle cx="58" cy="20" r="5.5" fill="#28c840"/>
  <text x="410" y="24" text-anchor="middle" class="dim" style="font-size:12px">priyanshu@dev: ~</text>
  <line x1="1" y1="38.5" x2="819" y2="38.5" stroke="#21262d"/>

  <!-- whoami -->
  <text x="24" y="70"><tspan class="user">priyanshu@dev</tspan>:<tspan class="path">~</tspan>$</text>
  <text x="168" y="70">whoami</text>
  <text class="out" x="24" y="96" style="--t:1.3s">Priyanshu Kumar · B.Tech CSE '26 · full-stack (MERN), React Native on the side</text>

  <!-- cat now.txt -->
  <text class="out" x="24" y="130" style="--t:1.9s"><tspan class="user">priyanshu@dev</tspan>:<tspan class="path">~</tspan>$</text>
  <text x="168" y="130">cat now.txt</text>
  <text class="out" x="24" y="156" style="--t:3.2s">sending bug fixes to the React &amp; Next.js libraries I use</text>

  <!-- ls merged/ -->
  <text class="out" x="24" y="190" style="--t:3.8s"><tspan class="user">priyanshu@dev</tspan>:<tspan class="path">~</tspan>$</text>
  <text x="168" y="190">ls merged/</text>
  <text class="out accent" x="24" y="216" style="--t:4.9s">mantine/   react-flow/   zag/   fumadocs/</text>

  <!-- prompt -->
  <text class="out" x="24" y="244" style="--t:5.4s"><tspan class="user">priyanshu@dev</tspan>:<tspan class="path">~</tspan>$</text>
  <rect class="cursor" x="168" y="231" width="8" height="17"/>

  <!-- typing covers, slid right one character at a time -->
  <g clip-path="url(#screen)">
    <rect class="cover" x="166" y="55" width="660" height="22" style="--t:0.5s;--d:0.6s;--n:6;--w:51px"/>
    <rect class="cover" x="166" y="115" width="660" height="22" style="--t:2.2s;--d:0.9s;--n:11;--w:93px"/>
    <rect class="cover" x="166" y="175" width="660" height="22" style="--t:4.1s;--d:0.7s;--n:10;--w:85px"/>
